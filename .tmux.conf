
set -g mouse on

# ============================================

# 🔥 SEXY TMUX CONFIG — для агентской разработки

# ============================================



# ----- ПРЕФИКС (Ctrl+space как в screen) -----


# ----- МЫШЬ (включаем полностью) -----

set -g mouse on



# ----- VIM-НАВИГАЦИЯ ПО СПЛИТАМ (как в vim) -----

unbind h

unbind j

unbind k

unbind l

bind h select-pane -L

bind j select-pane -D

bind k select-pane -U

bind l select-pane -R



# ----- VIM-НАВИГАЦИЯ через Ctrl+h/j/k/l (без префикса!) -----

# Это магия — не надо жать префикс, просто Ctrl+h и переходишь

bind -n C-h select-pane -L

bind -n C-j select-pane -D

bind -n C-k select-pane -U

bind -n C-l select-pane -R



# ----- РЕСАЙЗ СПЛИТОВ (Shift + стрелки) -----

bind -n S-Left resize-pane -L 5

bind -n S-Down resize-pane -D 5

bind -n S-Up resize-pane -U 5

bind -n S-Right resize-pane -R 5



# ----- VIM-РЕЖИМ КОПИРОВАНИЯ -----

set -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection

bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind -T copy-mode-vi V send -X select-line

unbind -T copy-mode-vi Enter

bind -T copy-mode-vi Enter send -X copy-selection-and-cancel



# ----- СКРОЛЛ (мышь + клава) -----

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"

bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "send-keys -M"



# ----- СТАТУСНАЯ СТРОКА -----

set -g status-style fg=white,bg=default

set -g status-left-length 60

set -g status-left "#[fg=cyan]#S #[fg=white]|"

set -g status-right "#[fg=yellow]#(whoami)@#(hostname -s) #[fg=white]| #[fg=green]#{cpu_percentage} #[fg=white]| #[fg=blue]#{ram_percentage} #[fg=white]| #[fg=magenta]%H:%M "

set -g status-right-length 100



# ----- ПЛАГИНЫ (TPM) -----

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'tmux-plugins/tmux-continuum'



# Автосохранение resurrect каждые 15 минут

set -g @continuum-save-interval '15'

set -g @resurrect-capture-pane-contents 'on'



# ----- БЫСТРЫЕ КОМАНДЫ ДЛЯ АГЕНТСКОЙ РАЗРАБОТКИ -----

# Создать новый горизонтальный сплит с cursor

bind C-n split-window -h -c "#{pane_current_path}" "agent"

# Создать новый вертикальный сплит с qwen

bind C-q split-window -v -c "#{pane_current_path}" "qwen"

# Создать сплит с БД (замени psql на свою команду, например sqlite3 / mysql)
#bind C-d split-window -h -c "#{pane_current_path}" "psql"



# ----- УДОБСТВА -----

# Перезагрузка конфига без выхода

bind r source-file ~/.tmux.conf \; display "Конфиг перезагружен!"

# Быстрое создание окна

bind c new-window -c "#{pane_current_path}"

# Быстрое разделение (| и -)

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"



# ----- СТАРТОВОЕ ПОВЕДЕНИЕ -----

# При первом запуске — одно окно с zsh (у тебя zsh с vim mode сам встанет)



# ----- ИНИЦИАЛИЗАЦИЯ TPM -----
run '~/.tmux/plugins/tpm/tpm'
