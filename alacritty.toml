[general]
import = []

# Тёмная схема в духе Nord (холодные серо‑синие, без черноты)
[colors.primary]
background = "0x2e3440"   # nord0
foreground = "0xe5e9f0"   # светлый текст

[colors.normal]
black   = "0x3b4252"      # nord1
red     = "0xbf616a"      # nord11
green   = "0xa3be8c"      # nord14
yellow  = "0xebcb8b"      # nord13
blue    = "0x81a1c1"      # nord9
magenta = "0xb48ead"      # nord15
cyan    = "0x88c0d0"      # nord8
white   = "0xe5e9f0"      # nord4

[colors.bright]
black   = "0x4c566a"      # nord3
red     = "0xd57780"
green   = "0xb4d196"
yellow  = "0xf0d399"
blue    = "0x8fb3d9"
magenta = "0xc8a5d4"
cyan    = "0x9ad2e2"
white   = "0xfafcff"

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"
LANG = "en_US.UTF-8"

[font]
size = 11

[font.normal]
family = "0xProto Nerd Font"
style = "Regular"


[window]
decorations = "None"
dynamic_padding = true
opacity = 0.9
startup_mode = "Maximized"


[terminal.shell]
program = "wsl"
args = [
    "--cd",
    "~"
]

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500

[scrolling]
history = 10000
multiplier = 3

[mouse]
hide_when_typing = true

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

# Клавиши: zoom и vi-mode (без биндов на копирование/удаление)
[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "Space"
mods = "Control|Shift"
action = "ToggleViMode"


